# Which of the two builds serves this request.
#
# Step 1: work out the hostname the VISITOR actually typed.
#
# The request reaches this container through a VPC Link, so its Host header is
# the Cloud Map internal name and is useless for routing. API Gateway therefore
# forwards the real one as x-airis-public-host - see the integration's
#   "overwrite:header.x-airis-public-host" = "$context.domainName"
# in airis/terraform/ui-apigw.tf. Nothing sets that header when the image is run
# directly (local `docker run`, the promote scripts' smoke tests), so fall back
# to $host, which is where a plain `curl -H 'Host: ...'` puts it.
map $http_x_airis_public_host $airis_public_host {
    ""      $host;
    default $http_x_airis_public_host;
}

# Step 2: pick the document root for that hostname.
#
# These are EXACT hostname matches, deliberately not regexes. An earlier regex
# form was a standing trap: an unanchored ~visinexa\.com also matches
# app.visinexa.com, which would silently serve the marketing page to everyone
# trying to reach the product - a failure that reads like a broken deploy
# rather than a config typo. Exact matches cannot do that.
#
# Marketing hosts get /marketing; everything else - notably app.visinexa.com
# and app.trominos.com - falls through to "" and gets the product application.
# Both builds live in the same image (see the two Dockerfile build stages), so
# adding a hostname here is a code change and needs a rebuild.
map $airis_public_host $airis_root_suffix {
    hostnames;

    www.visinexa.com     /marketing;
    visinexa.com         /marketing;
    portal.trominos.com  /marketing;   # legacy, kept until cutover

    portal.localhost     /marketing;   # local development
    marketing.localhost  /marketing;

    default              "";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html$airis_root_suffix;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sw.js {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
